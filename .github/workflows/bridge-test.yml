name: BridgeShort quality render test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Prepare output directory
        run: mkdir -p out
      - name: Render 3-second Full HD quality preview
        env:
          REMOTION_GL: angle
        run: npx remotion render src/index.tsx BridgeShort out/bridge-quality-preview.mp4 --frames=0-89 --scale=1 --codec=h264 --crf=16 --concurrency=1 --timeout=180000
      - name: Upload Full HD preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-fullhd-quality-preview
          path: out/bridge-quality-preview.mp4
          if-no-files-found: ignore
          retention-days: 7

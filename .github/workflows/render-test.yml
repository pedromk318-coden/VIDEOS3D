name: Remotion test render
on:
  push:
    paths:
      - "src/**"
      - "templates/bridge/**"
      - "public/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/render-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: Prepare output directory
        run: mkdir -p out
      - name: Render first 3 seconds (quarter scale)
        run: npm run render:test
      - name: Upload MP4 test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-test-video
          path: out/bridge-test.mp4
          if-no-files-found: warn
          retention-days: 7

name: RatShort 10-second test

on:
  push:
    branches:
      - rat-short-test
    paths:
      - "src/rat-index.tsx"
      - "src/videos/rat/**"
      - "scripts/generate_rat_sfx.py"
      - ".github/workflows/rat-short-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rat-render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Generate original sound effects
        run: python scripts/generate_rat_sfx.py
      - name: TypeScript check
        run: npm run typecheck
      - name: Render 10-second RatShort
        env:
          REMOTION_GL: angle
        run: |
          mkdir -p out
          npx remotion render src/rat-index.tsx RatShort out/rat-short-test.mp4 --scale=1 --codec=h264 --video-bitrate=35M --audio-bitrate=320k --x264-preset=slow --pixel-format=yuv420p --concurrency=1 --timeout=180000
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,width,height,r_frame_rate,bit_rate,pix_fmt -of json out/rat-short-test.mp4 > out/rat-short-test-metadata.json
      - name: Upload RatShort video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rat-short-test
          path: |
            out/rat-short-test.mp4
            out/rat-short-test-metadata.json
          if-no-files-found: ignore
          retention-days: 14
